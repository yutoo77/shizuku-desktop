<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
  <title>しずくとの会話</title>
  <link rel="stylesheet" href="dialogue.css">
</head>
<body>
  <header>
    <div class="identity"><h1>月白しずく</h1><span id="provider-status" class="demo">お試し・AI未接続</span></div>
    <details id="options">
      <summary aria-label="会話の設定">···</summary>
      <div class="options-panel">
        <label for="provider">返答</label>
        <select id="provider" disabled>
          <option value="local-demo">お試し（定型文）</option>
          <option value="openai" id="openai-option" disabled>OpenAI（従量課金）</option>
        </select>
        <p>切り替えると会話と入力を消します。</p>
        <p id="connection-help">接続設定を確認しています。</p>
        <div id="ai-details" hidden>
          <p id="ai-limits"></p>
          <p>アプリには保存しません。OpenAI側には不正利用の監視などの保存条件があります。中止しても、送信済みの処理や課金が止まるとは限りません。</p>
        </div>
        <label class="voice-toggle"><input id="voice" type="checkbox" disabled> 声で話す</label>
        <p class="voice-help">VOICEVOX:冥鳴ひまり<br>このPCのVOICEVOXを起動して使います。次の返答から読み上げ、閉じるとオフに戻ります。</p>
        <p>この窓を閉じると、アプリ内の会話は消えます。入力は1回1000文字、表示は直近40件までです。</p>
        <button id="clear" type="button">会話を消す</button>
      </div>
    </details>
    <button id="close" class="icon-button" type="button" aria-label="会話を閉じる">×</button>
  </header>
  <section class="conversation" aria-label="会話">
    <p id="empty">うん、ここにいるよ。</p>
    <div id="messages" role="log" aria-label="会話の履歴" aria-live="polite" aria-relevant="additions text"></div>
  </section>
  <form id="composer">
    <p id="error" role="alert"></p>
    <label class="sr-only" for="message">話しかける</label>
    <textarea id="message" aria-label="話しかける" placeholder="話しかける…" rows="2" maxlength="1000" enterkeyhint="send" spellcheck="false"></textarea>
    <p id="transmission" hidden>入力と直近の会話をOpenAIへ送ります。</p>
    <div class="composer-actions">
      <span id="pending" role="status" aria-live="polite"></span>
      <button id="cancel" type="button" hidden>中止</button>
      <button id="send" type="submit" disabled>送る</button>
    </div>
  </form>
  <script type="module" src="dialogue.js"></script>
</body>
</html>
