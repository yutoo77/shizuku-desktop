<!doctype html><html lang="ja"><meta charset="utf-8"><title>しずく・入力確認</title>
<style>body {margin:28px;background:#e9f2ff;font:18px 'Yu Gothic UI',sans-serif;color:#234;}button,textarea {font:inherit;padding:16px;border:1px solid #6889ad;border-radius:8px;background:white;}button {width:100%;height:340px;background:repeating-linear-gradient(45deg,#fff,#fff 20px,#d9eaff 20px,#d9eaff 40px)}textarea{box-sizing:border-box;width:100%;height:120px;margin-top:16px}</style>
<p>専用の入力確認窓</p><button id="target">クリック確認：0</button><textarea id="text" aria-label="入力確認" placeholder="入力確認"></textarea>
<script>window.clickCount=0; document.querySelector('#target').onclick=()=>{document.querySelector('#target').textContent='クリック確認：'+(++window.clickCount)};</script></html>
